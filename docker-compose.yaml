version: "3.8"
services:
  mongo:
    image: mongo:7
    container_name: pct-mongo
    volumes: ["mongo-data:/data/db"]
    ports:
      - "27017:27017"
    restart: unless-stopped

  api:
    build: ./capstone-api
    container_name: pct-api
    depends_on:
      - mongo
    ports:
      - "4000:4000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/policy-claims
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - PORT=4000
    restart: unless-stopped
  client:
    build: ./capstone-client
    container_name: pct-client
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  mongo-data: